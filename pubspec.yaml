name: omni_code
description: Client console for managing desktop coding agents.
publish_to: "none"
version: 0.7.1+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.1
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_soloud: ^4.1.6
  flutter_tts: ^4.2.2
  path_provider: ^2.1.5
  package_info_plus: ^8.1.1
  record: ^6.1.1
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^21.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  device_info_plus: ^11.1.0
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.7
  crypto: ^3.0.6
  flutter_svg: ^2.2.0
  file_selector: ^1.0.3
  ffi: ^2.1.0
  video_player: ^2.9.2
  super_clipboard: ^0.9.1
  encrypt: ^5.0.3
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/call_mode/glowing_orb_water_loop_inner_small.gif
    - assets/speech/silero_vad.onnx
  shaders:
    - shaders/call_mode_orb.frag
