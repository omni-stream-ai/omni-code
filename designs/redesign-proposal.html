<header class="intro"><h1>在手机上，掌控每一次推进。</h1><p>石墨 × 青柠 × 暖白。<br>用清晰层次、细腻表面与克制的色彩，突出每一次推进。<br>主界面提供深浅对照，后续流程按内容展开。</p></header>

<footer class="bottom"><div>296 个画面 · 413 个功能组<br>示例内容；本页用于查看设计，支持分组、主题和大图切换。字体以 Android 为基线，中文回退需在目标设备复核。</div><div><a href="coverage.md">查看入口、能力限制与条件状态</a><br><a href="mobile-refresh-concept.html?view=all">查看原视觉参考</a></div></footer></div><script>(function installGallery(DATA){
 const params=new URLSearchParams(location.search);
 let group=Math.min(DATA.length-1,Math.max(0,Number(params.get('group'))||0));
 let mode=['dark','light'].includes(params.get('view'))?params.get('view'):'all';
 let display=params.get('display')==='boards'?'boards':'screens';
 const make=(tag,attrs={},content='')=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(content)n.textContent=content;return n;};
 const imageLink=(src,alt)=>{const a=make('a',{href:src,target:'_blank',rel:'noopener'});a.append(make('img',{src,alt,loading:'lazy'}));return a;};
 function render(){
  const bothThemes=DATA[group].screens.some(s=>s.mode==='light')&&DATA[group].screens.some(s=>s.mode==='dark');if(!bothThemes)mode='dark';
  const tabs=document.querySelector('#groups');tabs.replaceChildren();
  DATA.forEach((g,i)=>tabs.append(make('button',{'data-group':i,class:group===i?'active':'','aria-pressed':group===i},g.name)));
  document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode));b.disabled=!bothThemes&&b.dataset.mode!=='dark';});
  document.querySelectorAll('[data-display]').forEach(b=>{b.classList.toggle('active',b.dataset.display===display);b.setAttribute('aria-pressed',String(b.dataset.display===display));});
  const g=DATA[group];let list=g.screens.filter(s=>mode==='all'||s.mode===mode);
  const order=['home','session','projects','project','settings'];
  if(group===0)list.sort((a,b)=>a.mode.localeCompare(b.mode)||order.indexOf(a.key)-order.indexOf(b.key));
  document.querySelector('#summary').textContent=g.assetOnly?'真实 Logo · 65 个 SVG 图标':g.name+' · '+list.length+' 个画面'+(!bothThemes?' · 深色展开':'');
  const stage=document.querySelector('#stage');stage.classList.toggle('conversation',g.boards.includes('24-conversation-refinement')&&display==='screens');stage.replaceChildren();
  if(display==='boards'||g.assetOnly){
   let sheets=g.boards;if(group===0&&mode!=='all')sheets=sheets.filter(n=>n.endsWith(mode));
   for(const n of sheets){const figure=make('figure',{class:'sheet'});figure.append(imageLink('previews/'+n+'.png',g.name+'整板预览'),make('figcaption',{},'点击查看原尺寸画板'));stage.append(figure);}
  }else{
   for(const s of list){const figure=make('figure',{class:'screen'}),h=make('h2',{},s.title);h.append(make('small',{},s.mode==='dark'?'DARK':'LIGHT'));figure.append(h,imageLink('previews/'+s.key+'-'+s.mode+'.png',s.title+' · '+(s.mode==='dark'?'深色':'浅色')),make('figcaption',{},s.note));stage.append(figure);}
  }
  const u=new URL(location.href);u.searchParams.set('view',mode);u.searchParams.set('group',group);u.searchParams.set('display',display);history.replaceState(null,'',u);
 }
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.group!==undefined)group=Number(b.dataset.group);if(b.dataset.mode)mode=b.dataset.mode;if(b.dataset.display)display=b.dataset.display;render();});
 render();
