<script>
const icon=(name,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const status=()=>`<div class="statusbar"><span>9:41</span><span class="device-icons">${icon('signal')}${icon('wifi')}${icon('battery','battery')}</span></div>`;
const indicator=()=>'<div class="home-indicator"></div>';
function session(title,preview,meta,time,waiting=false){return `<div class="session-row"><div class="session-icon">${icon(waiting?'branch':'terminal')}</div><div class="session-main"><div class="session-line"><strong>${title}</strong><time>${time}</time></div><p>${preview}</p><div class="session-meta">${meta}<span class="state ${waiting?'waiting':''}"><i class="dot ${waiting?'amber':''}"></i>${waiting?'待审批':'运行中'}</span></div></div></div>`;}
function home(){return `${status()}<div class="home-body"><div class="brandbar"><div class="brand"><span class="brandmark">${icon('logo')}</span>omni code</div><div class="avatar">J</div></div><div class="hero"><div class="overline">你的工作台</div><h2>接着，把想法做完。</h2><div class="connection"><i class="dot"></i>MacBook Pro 已连接 ${icon('down')}</div></div><div class="stats"><div class="stat"><strong>3</strong><span>运行中</span></div><div class="stat"><strong class="highlight">2</strong><span>待审批</span></div><div class="stat"><strong>8</strong><span>项目</span></div></div><div class="attention"><div class="attention-top">${icon('warning')}需要你确认<span class="count">02</span></div><h3>允许运行项目测试？</h3><div class="meta">omni-code · Claude Code</div><div class="command-inline"><code>flutter test</code><span>查看请求 ${icon('arrow')}</span></div></div><div class="section-title"><h3>最近会话</h3><span>${icon('more')}</span></div><div class="filters"><span class="filter active">全部</span><span class="filter">运行中 3</span><span class="filter">待审批 2</span></div>${session('优化移动端会话体验','正在整理输入区与执行状态','omni-code · Codex','刚刚')}${session('修复 Bridge 连接重试','等待确认测试命令','omni-code-bridge · Claude','3 分钟前',true)}<div class="section-title projects-title"><h3>最近项目</h3><span>查看全部 ${icon('chevron')}</span></div><div class="project-row">${icon('folder')}<div><strong>omni-code</strong><p>3 个活跃会话</p></div><span class="branch">${icon('branch')}main</span></div></div><div class="home-footer"><button class="new-session" data-demo="这是新建会话入口的视觉预览">${icon('plus')}新建会话</button><div class="nav"><div class="navitem selected">${icon('grid')}工作台</div><div class="navitem">${icon('folder')}项目</div><div class="navitem">${icon('sliders')}设置</div></div>${indicator()}</div>`;}
function chat(){return `${status()}<div class="chat-header">${icon('back')}<div class="chat-heading"><strong>优化移动端会话体验</strong><p>${icon('folder')}omni-code<span>·</span>Codex</p></div><span class="header-action">${icon('call')}</span>${icon('more')}</div><div class="chat-body"><div class="day-divider">今天 14:28</div><div class="user-message">把首页的待审批入口放到更明显的位置，顺便优化手机上的字号。</div><div class="assistant-label"><span class="mini-logo">${icon('logo')}</span>Codex<span class="time">14:28</span></div><p class="assistant-copy">我会调整首页的信息层级，让待审批事项优先显示，并统一会话列表的字号。</p><div class="tool-summary">${icon('check')}已查看 3 个文件 ${icon('chevron')}</div><div class="diff"><div class="diff-header">${icon('file')}home_screen.dart<span class="diff-count"><span class="add">+24</span><span class="del">−8</span></span></div><div class="code"><div><span class="number">168</span>style: textTheme.titleMedium,</div><div class="removed"><span class="number">169</span>− fontSize: 11,</div><div class="added"><span class="number">169</span>+ fontSize: 16,</div><div class="added"><span class="number">170</span>+ fontWeight: FontWeight.w600,</div></div></div><p class="assistant-copy">布局已调整。接下来测试导航与审批入口。</p><div class="approval"><div class="approval-title">${icon('warning')}需要运行命令<span>等待确认</span></div><div class="approval-command">flutter test</div><p>将在 omni-code 项目目录中执行</p><div class="approval-actions"><button class="deny" data-demo="审批按钮仅用于展示，此预览不会执行命令">拒绝</button><button class="allow" data-demo="审批按钮仅用于展示，此预览不会执行命令">${icon('check')}仅本次允许</button></div></div></div><div class="chat-footer"><div class="execution">${icon('warning')}等待审批 · 命令尚未执行<span>2 个文件已修改</span></div><div class="composer"><p class="placeholder">继续描述你的想法…</p><div class="composer-actions">${icon('plus')}<span class="model-switch">Codex · 自动 ${icon('down')}</span>${icon('mic','mic')}<span class="send">${icon('send')}</span></div></div>${indicator()}</div>`;}
const specs=[['dark','首页','HOME','待处理事项优先，快速接回最近的会话。',home],['dark','会话','SESSION','消息、代码与审批，各自保持清楚的层次。',chat],['light','首页','HOME','同一套布局，在日间保持轻盈与清晰。',home],['light','会话','SESSION','柔和底色，长回复和代码变更更易阅读。',chat]];
document.querySelector('#specimens').innerHTML=specs.map(([theme,title,en,caption,render],i)=>`<section class="spec ${theme}-spec"><div class="spec-label"><strong>0${i+1} / ${title} · ${theme==='dark'?'深色':'浅色'}</strong><span>${en}</span></div><div class="phone"><div class="screen ${theme} ${en==='HOME'?'home':'chat'}">${render()}</div></div><p class="spec-caption">${caption}</p></section>`).join('');
const params=new URLSearchParams(location.search);
function setView(view){if(!['all','dark','light'].includes(view))view='all';document.querySelector('.board').dataset.view=view;document.querySelectorAll('.controls button').forEach(b=>{const active=b.dataset.view===view;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});}
setView(params.get('view')||'all');if(params.has('export'))document.body.classList.add('export');
document.querySelectorAll('.controls button').forEach(b=>b.addEventListener('click',()=>{setView(b.dataset.view);history.replaceState(null,'',`?view=${b.dataset.view}`);}));
let toastTimer;document.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>{const toast=document.querySelector('.toast');toast.textContent=b.dataset.demo;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2500);}));
document.fonts.ready.then(()=>setTimeout(()=>{const checks=[...document.querySelectorAll('.spec')].filter(s=>getComputedStyle(s).display!=='none').map(s=>{const body=s.querySelector('.home-body,.chat-body');return {screen:s.querySelector('.spec-label strong').textContent,available:body.clientHeight,content:body.scrollHeight,fits:body.scrollHeight<=body.clientHeight};});document.documentElement.dataset.layoutChecks=JSON.stringify(checks);},50));
</script>
</body>
</html>
